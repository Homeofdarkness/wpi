[[effects]]
id = "salt_abundance"
dependencies = [{ group = "salts" }]
targets = ["salt_security"]
formula = "-target * groups.salts.deficit * 0.2"

[[effects]]
id = "freshwater_population_growth"
dependencies = [{ resource = "fresh_water" }]
targets = ["population_growth"]
formula = "-target * resources.fresh_water.deficit * 0.2"

[[effects]]
id = "construction_infrastructure_expenses"
dependencies = [{ group = "construction" }]
targets = ["infrastructure_expenses"]
formula = "target * (0.4 * groups.construction.deficit - min(0.25 * groups.construction.surplus, 0.2))"

[[effects]]
id = "hydrocarbons_transport"
dependencies = [{ group = "hydrocarbons" }]
targets = ["logistic", "trade_efficiency"]
formula = "-target * groups.hydrocarbons.deficit * 0.08"

[[effects]]
id = "freshwater_society"
dependencies = [{ resource = "fresh_water" }]
targets = ["contentment", "food_diversity"]
formula = "-target * resources.fresh_water.deficit * 0.05"

[[effects]]
id = "freshwater_epidemic"
dependencies = [{ resource = "fresh_water" }]
targets = ["population_epidemic_chance"]
formula = "8 * resources.fresh_water.deficit"

[[effects]]
id = "guild_stone_apparatus_efficiency"
dependencies = [{ resource = "guild_ceremonial_stone" }]
targets = ["state_apparatus_efficiency"]
formula = "min(6 * resources.guild_ceremonial_stone.surplus, 6)"

[[effects]]
id = "guild_stone_bureaucratic_reputation"
dependencies = [{ resource = "guild_ceremonial_stone" }]
targets = ["government_trust", "information_quality"]
formula = "min(4 * max(resources.guild_ceremonial_stone.surplus - 1.0, 0), 8)"