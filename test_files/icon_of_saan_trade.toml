schema_version = 2

# Номинально: до 5 образков в месяц продаются по 2 ед.вал. за штуку.
# Фактическое исполнение зависит от эффективности и загрузки торговли,
# валютного курса и качества товаров страны.
[[deals]]
id = "icon_of_saan_sale"
direction = "export"
delivery = { target = "resource:icon_of_saan", amount_per_month = 5.0 }
payment = { target = "money", amount_per_month = 10.0 }
